<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trace-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FF5500" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FF5500" stroke-width="0.2" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Fine Circuit Traces -->
  <g stroke="url(#trace-grad)" stroke-width="0.5" fill="none">
    <path d="M40 40 L90 40 L110 60 L190 60" />
    <path d="M360 360 L310 360 L290 340 L210 340" />
    <path d="M40 360 L40 310 L60 290 L60 210" />
    <path d="M360 40 L360 90 L340 110 L340 190" />
    
    <!-- Extra fine details -->
    <path d="M150 20 L150 40 L170 60" />
    <path d="M250 380 L250 360 L230 340" />
  </g>

  <!-- Sutble Nodes -->
  <g fill="#FF5500" fill-opacity="0.3">
    <circle cx="40" cy="40" r="1.5" />
    <circle cx="190" cy="60" r="1.5" />
    <circle cx="360" cy="360" r="1.5" />
    <circle cx="210" cy="340" r="1.5" />
    <circle cx="40" cy="360" r="1.5" />
    <circle cx="60" cy="210" r="1.5" />
    <circle cx="360" cy="40" r="1.5" />
    <circle cx="340" cy="190" r="1.5" />
  </g>
</svg>
